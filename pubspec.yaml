name: flutter_openai_realtime_api
description: Flutter client for the OpenAI Realtime GA API. WebRTC and WebSocket transports for low-latency voice and text conversations.
version: 0.1.1
homepage: https://github.com/crjfisher/flutter_openai_realtime_api
repository: https://github.com/crjfisher/flutter_openai_realtime_api
issue_tracker: https://github.com/crjfisher/flutter_openai_realtime_api/issues

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_webrtc: ^1.2.0
  http: ^1.1.0
  web_socket_channel: ^3.0.0
  logging: ^1.2.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

topics:
  - openai
  - realtime
  - webrtc
  - voice
  - ai

platforms:
  android:
  ios:
  web:
  macos:
